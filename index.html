
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#100b00">
<title>Mystery Wheel Playable</title>

<style>
:root {
  --gold: #ffdf22;
  --glow: 0 0 10px #ffdf22, 0 0 26px #ffca00, 0 0 46px #ffb90066;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #050400;
  touch-action: manipulation;
}

body {
  display: grid;
  place-items: center;
}

#game {
  position: relative;
  width: min(100vw, 56.25vh);
  height: min(177.7778vw, 100vh);
  height: min(177.7778vw, 100dvh);
  max-width: 100vw;
  max-height: 100vh;
  max-height: 100dvh;
  aspect-ratio: 9 / 16;
  overflow: hidden;
  background: #090700;
  isolation: isolate;
  user-select: none;
  -webkit-user-select: none;
  contain: layout paint;
}

img {
  user-select: none;
  -webkit-user-drag: none;
}

button {
  font: inherit;
}

.asset {
  position: absolute;
  object-fit: contain;
  pointer-events: none;
}

/* BACKGROUND */

#bgImage {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: -3;
}

#ambient {
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background:
    radial-gradient(
      ellipse at 50% 46%,
      transparent 35%,
      #0005 100%
    );
}

/* HEADLINES */

#headline {
  position: absolute;
  top: 7.7%;
  left: 3%;
  width: 94%;
  height: 15.5%;
  z-index: 4;
  transition: opacity .4s, transform .4s;
}

#title1 {
  left: 11%;
  top: 2%;
  width: 78%;
  height: 22%;
}

#title2 {
  left: 10%;
  top: 29%;
  width: 80%;
  height: 43%;
  filter: drop-shadow(0 0 8px #ffdf22);
}

#title3 {
  left: 12%;
  top: 79%;
  width: 40%;
  height: 11%;
}

/* TOP ICONS */

#topIcons {
  position: absolute;
  z-index: 5;
  top: 21.1%;
  right: 3%;
  width: 42%;
  height: 11.3%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 4%;
  transition: opacity .35s, transform .35s;
}

.top-icon {
  width: 48%;
  height: 100%;
  object-fit: contain;
  filter: drop-shadow(0 0 7px #ffdf22);
  pointer-events: none;
}

/* WHEEL */

#wheelWrap {
  position: absolute;
  left: 3.3%;
  top: 33%;
  width: 71%;
  aspect-ratio: 1;
  z-index: 3;
  transition:
    transform .8s,
    left .8s,
    top .8s,
    width .8s,
    filter .4s;
}

#wheelGlow {
  position: absolute;
  inset: -1%;
  border-radius: 50%;
  box-shadow: 0 0 18px #ffdf2244;
  pointer-events: none;
  z-index: 0;
}

#wheelImage {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  transform: rotate(0deg);
  transform-origin: center center;
  filter:
    drop-shadow(0 0 8px #ffdf22aa)
    drop-shadow(0 0 16px #ffca0066);
  z-index: 1;
  will-change: transform;
}

#pointer {
  position: absolute;
  z-index: 6;
  left: 50%;
  top: -6%;
  width: 10%;
  height: 18%;
  object-fit: contain;
  transform: translateX(-50%);
  filter: drop-shadow(0 0 8px #ffdf22);
  pointer-events: none;
}

#spinBtn {
  position: absolute;
  z-index: 8;
  left: 50%;
  top: 50%;
  width: 22%;
  height: 22%;
  padding: 0;
  border: 0;
  background: transparent;
  transform: translate(-50%, -50%);
  display: grid;
  place-items: center;
  cursor: pointer;
  animation: spinPulse 1.2s ease-in-out infinite;
  touch-action: manipulation;
}

#spinBtn img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  pointer-events: none;
}

#spinBtn:disabled {
  animation: none;
  cursor: default;
  opacity: 1;
}

@keyframes spinPulse {
  0%, 100% {
    filter: drop-shadow(0 0 5px #ffdf22);
  }

  50% {
    filter:
      drop-shadow(0 0 17px #ffdf22)
      drop-shadow(0 0 26px #ffbb00);
  }
}

/* CHARACTERS */

#girlMystery {
  z-index: 7;
  right: 0;
  bottom: -1%;
  width: 83%;
  height: auto;
  max-height: 100%;
  object-position: center bottom;
  filter: drop-shadow(0 0 15px #ffdc22);
  transition:
    opacity .35s,
    left .85s,
    right .85s,
    bottom .85s,
    width .85s,
    transform .85s;
}

#questionMark {
  z-index: 9;
  right: 7%;
  bottom: 12%;
  width: 19%;
  height: 15%;
  object-fit: contain;
  filter: drop-shadow(0 0 9px #ffdf22);
  animation: questionFloat 1.8s ease-in-out infinite;
  transition: opacity .3s;
}

@keyframes questionFloat {
  0%, 100% {
    transform: translateY(0) rotate(-2deg);
  }

  50% {
    transform: translateY(-8px) rotate(2deg);
  }
}

/* OVERLAY */

#blurOverlay {
  position: absolute;
  inset: 0;
  z-index: 10;
  background: #0806003d;
  -webkit-backdrop-filter: blur(0);
  backdrop-filter: blur(0);
  opacity: 0;
  pointer-events: none;
  transition: opacity .45s, backdrop-filter .45s;
}

#characterReveal {
  z-index: 13;
  left: 50%;
  top: 60%;
  width: 100%;
  height: auto;
  max-height: 100%;
  object-fit: contain;
  object-position: center;
  transform: translate(-50%, -50%) scale(.94);
  opacity: 0;
  filter: drop-shadow(0 0 20px #ffdc22);
  transition:
    opacity .4s,
    transform .65s,
    left .85s,
    top .85s,
    width .85s,
    filter .3s;
}


#speech {
  position: absolute;
  z-index: 15;
  left: 15%;
  top: 56%;
  width: 55%;
  height: auto;
  object-fit: contain;
  opacity: 0;
  transform: translateY(15px) scale(.92);
  transition: opacity .35s, transform .35s;
  pointer-events: none;
}

/* REWARD AND CTA */

#reward {
  position: absolute;
  z-index: 18;
  left: 50%;
  top: 4%;
  width: 100%;
  height: auto;
  padding: 0;
  transform: translate(-50%, -15px) scale(.75);
  border: 0;
  background: transparent;
  opacity: 0;
  pointer-events: none;
  transition: opacity .4s, transform .4s;
  filter: drop-shadow(0 0 12px #ffdf22);
  cursor: pointer;
  animation: rewardPulse 1.6s ease-in-out infinite;
}

#reward img {
  display: block;
  width: 100%;
  height: auto;
  object-fit: contain;
}

@keyframes rewardPulse {
  0%, 100% {
    filter: drop-shadow(0 0 8px #ffdf22) drop-shadow(0 0 12px rgba(255, 223, 34, .75));
    transform: translate(-50%, -15px) scale(.75);
  }

  50% {
    filter: drop-shadow(0 0 16px #ffdf22) drop-shadow(0 0 24px rgba(255, 223, 34, 1));
    transform: translate(-50%, -15px) scale(.82);
  }
}

/* SOUND */

#soundBtn {
  position: absolute;
  z-index: 25;
  top: 1.5%;
  right: 2.5%;
  width: 8%;
  height: 4.5%;
  min-width: 28px;
  min-height: 28px;
  border: 0;
  background: transparent;
  padding: 0;
  display: grid;
  place-items: center;
  cursor: pointer;
  filter: drop-shadow(0 0 5px #ffdf22);
  touch-action: manipulation;
}

#soundBtn span {
  display: block;
  font-size: clamp(16px, 4vw, 28px);
  line-height: 1;
  color: #ffdf22;
  text-shadow: 0 0 8px #ffdf22;
}

/* REVEAL SCENE */

#game.scene-reveal #headline,
#game.scene-reveal #topIcons {
  opacity: 1;
}

#game.scene-reveal #wheelWrap {
  filter: blur(2.5px);
}

#game.scene-reveal #girlMystery,
#game.scene-reveal #questionMark {
  opacity: 0;
}

#game.scene-reveal #blurOverlay,
#game.scene-final #blurOverlay {
  opacity: 1;
  -webkit-backdrop-filter: blur(2.5px);
  backdrop-filter: blur(2.5px);
}

#game.show-character #characterReveal {
  opacity: 1;
  transform: translate(-50%, -50%) scale(1);
  cursor: pointer;
}

#game.scene-final #characterReveal {
  cursor: pointer;
}

#game.show-speech #speech {
  opacity: 1;
  transform: translateY(0) scale(1);
}

/* SECOND SCENE */

#game.scene-two #headline {
  top: 5%;
  height: 15%;
}

#game.scene-two #title1 {
  display: none;
}

#game.scene-two #title2 {
  top: 0;
  left: 9%;
  width: 82%;
  height: auto;
}

#game.scene-two #title3 {
  top: 55%;
  left: 10%;
  width: 78%;
  height: auto;
  filter: drop-shadow(0 0 8px #ffdf22);
}

#game.scene-two #topIcons {
  opacity: 0;
  transform: translateY(-16px);
  pointer-events: none;
}

#game.scene-two #girlMystery,
#game.scene-two #questionMark {
  opacity: 0;
}

#game.scene-two #characterReveal {
  left: 70%;
  top: 84.5%;
  width: 80%;
  height: auto;
  opacity: 1;
  transform: translate(-50%, -50%) scale(1);
  z-index: 7;
}

#game.scene-two #wheelWrap {
  left: 50%;
  top: 48%;
  width: 88%;
  transform: translate(-50%, -50%);
  filter: none !important;
  z-index: 14;
}

#game.scene-two #blurOverlay {
  opacity: 0 !important;
  -webkit-backdrop-filter: none !important;
  backdrop-filter: none !important;
}

/* FINAL SCENE */

#game.scene-final #headline,
#game.scene-final #topIcons {
  opacity: 0;
  pointer-events: none;
}

#game.scene-final #wheelWrap {
  transform: scale(.94);
}

#game.scene-final #girlMystery,
#game.scene-final #questionMark {
  opacity: 0;
}

#game.scene-final #characterReveal {
  left: 50%;
  top: 60%;
  width: 100%;
  height: auto;
  opacity: 1;
  transform: translate(-50%, -50%) scale(1.04);
}

#game.scene-final #speech {
  top: 58%;
  left: 12%;
  width: 60%;
  height: auto;
}

#game.scene-final #reward {
  opacity: 1;
  transform: translate(-50%, 0) scale(1);
  pointer-events: auto;
}

#game.scene-final #spinBtn {
  opacity: 0;
  pointer-events: none;
}

/* SMALL SCREENS */

@media (max-height: 650px) {
  #wheelWrap {
    top: 30%;
  }

  #girlMystery {
    width: auto;
    height: 45%;
    max-width: 100%;
  }

  #speech {
    top: 22%;
  }

  #game.scene-two #wheelWrap {
    top: 48%;
  }
}

@media (prefers-reduced-motion: reduce) {
  #questionMark,
  #spinBtn {
    animation-duration: 2.5s;
  }
}
</style>
</head>

<body>
<main id="game" aria-label="Mystery Wheel playable ad">

  <img
    id="bgImage"
    src="assets/background.png"
    alt=""
    draggable="false"
  >

  <div id="headline">
    <img class="asset" id="title1" src="assets/title-1.png" alt="" draggable="false">
    <img class="asset" id="title2" src="assets/title-2.png" alt="" draggable="false">
    <img class="asset" id="title3" src="assets/title-3.png" alt="" draggable="false">
  </div>

  <div id="topIcons">
    <img class="top-icon" id="icon1" src="assets/icon-1.png" alt="" draggable="false">
    <img class="top-icon" id="icon2" src="assets/icon-2.png" alt="" draggable="false">
  </div>

  <section id="wheelWrap" aria-label="Prize wheel">
    <div id="wheelGlow"></div>

    <img
      id="wheelImage"
      src="assets/wheel-1.png"
      alt=""
      draggable="false"
    >

    <img
      class="asset"
      id="pointer"
      src="assets/pointer.png"
      alt=""
      draggable="false"
    >

    <button id="spinBtn" type="button" aria-label="Spin the wheel">
      <img src="assets/spin.png" alt="" draggable="false">
    </button>
  </section>

  <img
    class="asset"
    id="girlMystery"
    src="assets/girl-mystery.png"
    alt=""
    draggable="false"
  >

  <img
    class="asset"
    id="questionMark"
    src="assets/question.png"
    alt=""
    draggable="false"
  >

  <div id="blurOverlay"></div>

  <img
    class="asset"
    id="characterReveal"
    src="assets/girl-reveal.png"
    alt=""
    draggable="false"
  >

  <img
    id="speech"
    src="assets/bubble-1.png"
    alt=""
    draggable="false"
  >

  <button id="reward" type="button" aria-label="Open reward website">
    <img src="assets/reward.png" alt="" draggable="false">
  </button>

  <button
    id="soundBtn"
    type="button"
    aria-label="Mute sound"
    aria-pressed="false"
  >
    <span aria-hidden="true">🔊</span>
  </button>

  <div id="ambient"></div>
</main>

<script>
(() => {
  'use strict';

  /* CONFIGURATION */

  const CONFIG = {
    ctaUrl: 'https://honeytoon.com/comic/redheads-first-ride/1',

    firstRevealDelay: 2100,
    characterDelay: 220,
    firstBubbleDelay: 700,
    secondBubbleDelay: 3700,
    sceneTwoDelayAfterBubble: 2600,

    spinDurationFirst: 4600,
    spinDurationSecond: 5000,

    continuousSpeed: 0.42,

    music: 'assets/music.mp3',
    spinSound: 'assets/spin.mp3',
    wowSound: 'assets/wow.mp3',

    sceneTwoTitle2: 'assets/title-2-stage2.png',
    sceneTwoTitle3: 'assets/title-3-stage2.png',

    bubbleOne: 'assets/bubble-1.png',
    bubbleTwo: 'assets/bubble-2.png',
    finalBubble: 'assets/bubble-final.png',

    wheelOne: 'assets/wheel-1.png',
    wheelTwo: 'assets/wheel-2.png',

    characterFirst: 'assets/girl-reveal.png',
    characterFinal: 'assets/girl-final.png',

    fadeDuration: 600
  };

  const $ = id => document.getElementById(id);

  const game = $('game');
  const wheel = $('wheelImage');
  const spinBtn = $('spinBtn');
  const girl = $('girlMystery');
  const question = $('questionMark');
  const reveal = $('characterReveal');
  const speech = $('speech');
  const soundBtn = $('soundBtn');
  const soundGlyph = soundBtn.querySelector('span');

  const START_ANGLE = 0;

  let rotation = START_ANGLE;
  let spinning = false;
  let spinCount = 0;
  let audioEnabled = true;
  let audioStarted = false;

  let music = null;
  let spinAudio = null;
  let wowAudio = null;

  /* CENTRALIZED ANIMATION CONTROL */

  let wheelAnimationId = 0;
  let wheelAnimationMode = 'idle';
  let wheelAnimationGeneration = 0;
  let fadeGeneration = 0;

  /* TIMER CONTROL */

  const timers = new Set();

  function managedTimeout(callback, delay) {
    let id;

    id = setTimeout(() => {
      timers.delete(id);
      callback();
    }, delay);

    timers.add(id);
    return id;
  }

  function clearManagedTimers() {
    for (const id of timers) {
      clearTimeout(id);
    }

    timers.clear();
  }

  /* AUDIO INITIALIZATION */

  function makeAudio(src, loop, volume) {
    const audio = new Audio(src);

    audio.loop = !!loop;
    audio.volume = volume;
    audio.preload = 'auto';

    audio.addEventListener('error', () => {
      console.warn('[Playable] Audio unavailable:', src);
    });

    return audio;
  }

  try {
    music = makeAudio(CONFIG.music, true, 0.35);
    spinAudio = makeAudio(CONFIG.spinSound, true, 0.8);
    wowAudio = makeAudio(CONFIG.wowSound, false, 1);
  } catch (error) {
    console.warn('[Playable] Audio initialization failed:', error);
  }

  function safePlay(audio, restart = false) {
    if (!audio || !audioEnabled) return;

    try {
      if (restart) {
        audio.currentTime = 0;
      }

      const promise = audio.play();

      if (promise && typeof promise.catch === 'function') {
        promise.catch(error => {
          console.warn('[Playable] Audio playback blocked:', error);
        });
      }
    } catch (error) {
      console.warn('[Playable] Audio playback failed:', error);
    }
  }

  function startAudio() {
    if (audioStarted) return;

    audioStarted = true;
    safePlay(music);
  }

  function pauseAudio(audio) {
    if (!audio) return;

    try {
      audio.pause();
    } catch (error) {
      console.warn('[Playable] Audio pause failed:', error);
    }
  }

  function stopAudio(audio) {
    if (!audio) return;

    try {
      audio.pause();
      audio.currentTime = 0;
    } catch (error) {
      console.warn('[Playable] Audio reset failed:', error);
    }
  }

  /* SPIN AUDIO */

  function stopSpinAudio() {
    fadeGeneration++;
    stopAudio(spinAudio);

    if (spinAudio) {
      spinAudio.volume = 0.8;
    }
  }

  function fadeOutSpinAudio() {
    if (!spinAudio || spinAudio.paused) return;

    const generation = ++fadeGeneration;
    const startVolume = spinAudio.volume;
    const startAt = performance.now();
    const duration = CONFIG.fadeDuration;

    function tick(now) {
      if (generation !== fadeGeneration) return;

      const t = Math.min(1, (now - startAt) / duration);
      const ease = 1 - Math.pow(1 - t, 3);

      spinAudio.volume = Math.max(
        0,
        startVolume * (1 - ease)
      );

      if (t < 1) {
        requestAnimationFrame(tick);
      } else {
        stopAudio(spinAudio);
        spinAudio.volume = 0.8;
      }
    }

    requestAnimationFrame(tick);
  }

  /* WHEEL ANIMATION */

  function cancelWheelAnimation() {
    wheelAnimationGeneration++;

    if (wheelAnimationId) {
      cancelAnimationFrame(wheelAnimationId);
    }

    wheelAnimationId = 0;
    wheelAnimationMode = 'idle';
  }

  function applyWheelRotation() {
    wheel.style.transform = `rotate(${rotation}deg)`;
  }

  function startContinuousSpin() {
    cancelWheelAnimation();

    const generation = wheelAnimationGeneration;
    wheelAnimationMode = 'continuous';

    let lastFrame = 0;

    function frame(now) {
      if (
        generation !== wheelAnimationGeneration ||
        wheelAnimationMode !== 'continuous'
      ) {
        return;
      }

      if (lastFrame) {
        const deltaTime = Math.min(now - lastFrame, 50);

        rotation += deltaTime * CONFIG.continuousSpeed;
        applyWheelRotation();
      }

      lastFrame = now;
      wheelAnimationId = requestAnimationFrame(frame);
    }

    wheelAnimationId = requestAnimationFrame(frame);
  }

  function rotateWheelByTurns(turns, duration, done) {
    cancelWheelAnimation();

    const generation = wheelAnimationGeneration;
    wheelAnimationMode = 'decelerating';

    const startAngle = rotation;
    const deltaAngle = 360 * Math.max(1, Math.round(turns));
    const startAt = performance.now();

    function frame(now) {
      if (
        generation !== wheelAnimationGeneration ||
        wheelAnimationMode !== 'decelerating'
      ) {
        return;
      }

      const t = Math.min(1, (now - startAt) / duration);

      const ease = 1 - Math.pow(1 - t, 4);

      rotation = startAngle + deltaAngle * ease;
      applyWheelRotation();

      if (t < 1) {
        wheelAnimationId = requestAnimationFrame(frame);
        return;
      }

      rotation = startAngle + deltaAngle;
      applyWheelRotation();

      wheelAnimationId = 0;
      wheelAnimationMode = 'idle';

      if (typeof done === 'function') {
        done();
      }
    }

    wheelAnimationId = requestAnimationFrame(frame);
  }

  function resetWheelToStart() {
    cancelWheelAnimation();

    rotation = START_ANGLE;
    applyWheelRotation();
  }

  /* ASSET HELPERS */

  function setWheel(src) {
    wheel.src = src;
  }

  function setBubble(src) {
    speech.src = src;
  }

  function setCharacter(src) {
    reveal.src = src;
  }

  /* SCENE STATE */

  function isFinalScene() {
    return game.classList.contains('scene-final');
  }

  function enterFinalScene() {
    clearManagedTimers();
    cancelWheelAnimation();
    stopSpinAudio();

    spinning = false;

    game.classList.remove(
      'scene-two',
      'scene-reveal',
      'show-character',
      'show-speech'
    );

    game.classList.add('scene-final');

    setCharacter(CONFIG.characterFinal);
    setBubble(CONFIG.finalBubble);

    reveal.style.opacity = '';
    speech.style.opacity = '';
    speech.style.transform = '';

    game.classList.add('show-speech');

    safePlay(wowAudio, true);
  }

  /* FIRST REVEAL */

  function startFirstReveal() {
    if (spinCount !== 1 || isFinalScene()) return;

    game.classList.add('scene-reveal');

    girl.style.opacity = '0';
    question.style.opacity = '0';

    setCharacter(CONFIG.characterFirst);

    managedTimeout(() => {
      if (isFinalScene()) return;

      fadeOutSpinAudio();
      game.classList.add('show-character');
    }, CONFIG.characterDelay);

    managedTimeout(() => {
      if (isFinalScene()) return;

      setBubble(CONFIG.bubbleOne);
      game.classList.add('show-speech');
    }, CONFIG.firstBubbleDelay);

    managedTimeout(() => {
      if (isFinalScene()) return;

      setBubble(CONFIG.bubbleTwo);
    }, CONFIG.secondBubbleDelay);

    const total =
      CONFIG.firstBubbleDelay +
      CONFIG.secondBubbleDelay +
      CONFIG.sceneTwoDelayAfterBubble;

    managedTimeout(() => {
      if (spinCount !== 1 || isFinalScene()) return;

      cancelWheelAnimation();
      stopSpinAudio();

      spinning = false;

      game.classList.remove(
        'scene-reveal',
        'show-character',
        'show-speech'
      );

      game.classList.add('scene-two');

      resetWheelToStart();

      $('title2').src = CONFIG.sceneTwoTitle2;
      $('title3').src = CONFIG.sceneTwoTitle3;

      setWheel(CONFIG.wheelTwo);

      reveal.style.opacity = '';
      speech.style.opacity = '';
      speech.style.transform = '';

      girl.style.opacity = '0';
      question.style.opacity = '0';

      spinBtn.disabled = false;
    }, total);
  }

  /* SPIN BUTTON */

  function beginSpin() {
    if (
      spinning ||
      spinBtn.disabled ||
      spinCount >= 2 ||
      isFinalScene()
    ) {
      return;
    }

    startAudio();

    spinning = true;
    spinCount++;

    spinBtn.disabled = true;

    // Restart the spin sound for each spin.
    safePlay(spinAudio, true);

    if (spinCount === 1) {
      startContinuousSpin();

      managedTimeout(() => {
        startFirstReveal();
      }, CONFIG.firstRevealDelay);

      return;
    }

    const turns = 5 + Math.floor(Math.random() * 3);

    rotateWheelByTurns(
      turns,
      CONFIG.spinDurationSecond,
      () => {
        if (isFinalScene()) return;

        spinning = false;
        fadeOutSpinAudio();
        enterFinalScene();
      }
    );
  }

  spinBtn.addEventListener('click', beginSpin);

  /* SOUND BUTTON */

  function updateSoundButton() {
    soundGlyph.textContent = audioEnabled ? '🔊' : '🔇';

    soundBtn.setAttribute(
      'aria-label',
      audioEnabled ? 'Mute sound' : 'Enable sound'
    );

    soundBtn.setAttribute(
      'aria-pressed',
      String(!audioEnabled)
    );
  }

  soundBtn.addEventListener('click', () => {
    audioEnabled = !audioEnabled;

    updateSoundButton();

    if (!audioEnabled) {
      pauseAudio(music);
      pauseAudio(spinAudio);
      pauseAudio(wowAudio);

      fadeGeneration++;
      return;
    }

    if (audioStarted) {
      safePlay(music);

      if (spinning) {
        safePlay(spinAudio);
      } else if (isFinalScene()) {
      }
    }
  });

  updateSoundButton();

  /* CTA */

  function openSite() {
    if (!CONFIG.ctaUrl) return;

    window.location.assign(CONFIG.ctaUrl);
  }

  reveal.addEventListener('click', openSite);
  $('reward').addEventListener('click', openSite);

  /* ASSET DIAGNOSTICS */

  document.querySelectorAll('img').forEach(img => {
    img.addEventListener('error', () => {
      console.warn(
        '[Playable] Image failed to load:',
        img.getAttribute('src')
      );

      if (img.id !== 'bgImage') {
        img.style.visibility = 'hidden';
      }
    });
  });

  /* LIFECYCLE */

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      return;
    }

    
  });

})();
</script>

</body>
</html>
